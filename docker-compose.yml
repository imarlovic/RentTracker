services:
  db:
    image: postgres:16-alpine
    container_name: renttracker-db
    environment:
      POSTGRES_DB: renttracker
      POSTGRES_USER: renttracker
      POSTGRES_PASSWORD: renttracker
    ports:
      - "5432:5432"
    volumes:
      - renttracker_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renttracker -d renttracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: renttracker-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: renttracker
      MINIO_ROOT_PASSWORD: renttrackersecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - renttracker_minio:/data

volumes:
  renttracker_pg:
  renttracker_minio:
